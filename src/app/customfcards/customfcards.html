<div class="container">
  <div class="card">

    <h2 class="editable" contenteditable="true">
      {{ cards[currentIndex].title }}
    </h2>

    <p class="editable" contenteditable="true">
      {{ cards[currentIndex].content }}
    </p>

    <div class="buttons">
  <button (click)="prev()" [disabled]="currentIndex === 0">
    BACK
  </button>

  <button (click)="next()" [disabled]="currentIndex === cards.length - 1">
    NEXT
  </button>

  <a class="end" routerLink="/flashcards">
    END
  </a>
</div>

  </div>
</div>
