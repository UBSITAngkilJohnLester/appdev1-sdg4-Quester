<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Flashcards</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #9ec9d9;
}


input {
  display: none;
}


.container {
  width: 520px;
}


.card {
  display: none;
  background: #ffffff;
  padding: 30px;
  border-radius: 15px;
  border: 2px solid #444;
  text-align: center;
  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}


#c1:checked ~ .cards .card1,
#c2:checked ~ .cards .card2,
#c3:checked ~ .cards .card3,
#c4:checked ~ .cards .card4 {
  display: block;
}


.editable {
  outline: none;
  cursor: text;
  padding: 8px;
}

h2.editable {
  margin-bottom: 15px;
}

p.editable {
  font-size: 18px;
}


.editable:focus {
  outline: 2px solid #00a8cc;
  background: #f0fbff;
}


.buttons {
  margin-top: 20px;
}

label, a {
  text-decoration: none;
  padding: 10px 18px;
  margin: 5px;
  background: #00a8cc;
  color: black;
  border-radius: 8px;
  border: 2px solid #333;
  display: inline-block;
  cursor: pointer;
}

label:hover, a:hover {
  background: #008da8;
}


.end {
  background: #ff4d4d;
}

.end:hover {
  background: #cc0000;
}
</style>
</head>

<body>

<div class="container">


  <input type="radio" name="card" id="c1" checked>
  <input type="radio" name="card" id="c2">
  <input type="radio" name="card" id="c3">
  <input type="radio" name="card" id="c4">

  <div class="cards">

  
    <div class="card card1">
      <h2 class="editable" contenteditable="true">Card 1</h2>
      <p class="editable" contenteditable="true">Type your content here...</p>

      <div class="buttons">
        <label for="c2">Next</label>
        <a class="end" href="index.html">End</a>
      </div>
    </div>

   
    <div class="card card2">
      <h2 class="editable" contenteditable="true">Card 2</h2>
      <p class="editable" contenteditable="true">Type your content here...</p>

      <div class="buttons">
        <label for="c1">Back</label>
        <label for="c3">Next</label>
        <a class="end" href="index.html">End</a>
      </div>
    </div>

  
    <div class="card card3">
      <h2 class="editable" contenteditable="true">Card 3</h2>
      <p class="editable" contenteditable="true">Type your content here...</p>

      <div class="buttons">
        <label for="c2">Back</label>
        <label for="c4">Next</label>
        <a class="end" href="index.html">End</a>
      </div>
    </div>


    <div class="card card4">
      <h2 class="editable" contenteditable="true">Card 4</h2>
      <p class="editable" contenteditable="true">Type your content here...</p>

      <div class="buttons">
        <label for="c3">Back</label>
        <a class="end" href="index.html">End</a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
