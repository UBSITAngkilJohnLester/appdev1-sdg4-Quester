<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcards Menu</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial;
  margin: 0;
  height: 70vh;
  overflow: hidden; 
  display: flex;
  justify-content: center;
  align-items: center;
}


.deck {
  display: grid;
  grid-template-columns: repeat(2, 360px);
  grid-template-rows: repeat(2, 200px);
  gap: 25px;
}


.column {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}


.subject {
  font-weight: bold;
  margin-bottom: 10px;
  font-size: 18px;
}


.card {
  width: 320px;   
  height: 180px;  
  border: 2px solid #333;
  border-radius: 12px;
  background: white;
  text-decoration: none;
  color: black;

  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;

  font-size: 20px;
  transition: 0.2s;
}


.card:hover {
  transform: scale(1.05);
  background: #f5f5f5;
}

</style>
</head>

<body>

<div class="deck">

  <div class="column">
    <div class="subject">OPSYST1</div>
    <a class="card" href="opsyst1fcards.html">OS Definition</a>
  </div>

  <div class="column">
    <div class="subject">PROGIT1</div>
    <a class="card" href="progit1fcards.html">Variable</a>
  </div>

  <div class="column">
    <div class="subject">SITNET1</div>
    <a class="card" href="sitnet1fcards.html">Network</a>
  </div>

  <div class="column">
    <div class="subject">CUSTOM</div>
    <a class="card" href="customcards.html">Edit Card</a>
  </div>

</div>

</body>
</html>
