<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcards Menu</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #d5f0f8;
  text-align: center;
  padding: 40px 20px;
}


h1 {
  font-size: 48px;
  margin-bottom: 40px;
}


.section-title {
  font-size: 24px;
  margin-bottom: 30px;
}


.deck {
  display: grid;
  grid-template-columns: repeat(2, 320px);
  gap: 30px;
  justify-content: center;
}


.column {
  background: #eee;
  padding: 20px;
  border-radius: 12px;
  border: 2px solid #444;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}


.subject {
  font-size: 22px;
  margin-bottom: 10px;
}


.desc {
  font-size: 14px;
  margin-bottom: 20px;
}


.card {
  display: inline-block;
  padding: 10px 20px;
  background: #00a8cc;
  border-radius: 8px;
  text-decoration: none;
  color: black;
  border: 2px solid #333;
  transition: 0.2s;
}

.card:hover {
  background: #008da8;
  transform: scale(1.05);
}
</style>
</head>

<body>

<h1>Welcome to Flash-Cards</h1>

<h2 class="section-title">Choose a Subject</h2>

<div class="deck">

  <div class="column">
    <div class="subject">PROGAMMING</div>
    <div class="desc">Flashcards</div>
    <a class="card" routerLink="/opsyst1fcards">Go to Flashcards</a>
  </div>

  <div class="column">
    <div class="subject">NETWORKING</div>
    <div class="desc">Flashcards</div>
    <a class="card" routerLink="/progit1fcards">Go to Flashcards</a>
  </div>

  <div class="column">
    <div class="subject">OPERATING SYSTEM</div>
    <div class="desc">Flashcards</div>
    <a class="card" routerLink="/sitnet1fcards">Go to Flashcards</a>
  </div>

  <div class="column">
    <div class="subject">CUSTOM</div>
    <div class="desc">Flashcards</div>
    <a class="card" routerLink="/customfcards">Edit Cards</a>
  </div>

</div>

</body>
</html>
