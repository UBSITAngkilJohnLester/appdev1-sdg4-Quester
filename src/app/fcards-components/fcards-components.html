<h1>Welcome to Flash-Cards</h1>

<h2 class="section-title">Choose a Subject</h2>

<div class="deck">
  <div class="column" *ngFor="let deck of decks">
    
    <div class="subject">{{ deck.title }}</div>
    <div class="desc">{{ deck.desc }}</div>

    <a class="card" [routerLink]="deck.link">
      {{ deck.buttonText }}
    </a>

  </div>
</div>
