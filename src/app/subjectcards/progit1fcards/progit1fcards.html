<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PROGIT1 Flashcards</title>

<style>
body {
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f4f4f4;
  margin: 0;
}


input {
  display: none;
}


.card {
  width: 500px;
  padding: 30px;
  background: white;
  border-radius: 15px;
  border: 2px solid #333;
  text-align: center;
  font-size: 22px;
  position: absolute;
  opacity: 0;
  transition: 0.3s;
}


#c1:checked ~ .cards .card1,
#c2:checked ~ .cards .card2,
#c3:checked ~ .cards .card3 {
  opacity: 1;
  position: relative;
}


.buttons {
  margin-top: 20px;
}

a, label {
  text-decoration: none;
  padding: 10px 15px;
  margin: 5px;
  background: #4CAF50;
  color: white;
  border-radius: 5px;
  display: inline-block;
  cursor: pointer;
}

.end {
  background: red;
}

.container {
  position: relative;
  width: 500px;
}


.cards {
  position: relative;
  width: 100%;
  height: 250px;
}
</style>
</head>

<body>

<div class="container">

 
  <input type="radio" name="card" id="c1" checked>
  <input type="radio" name="card" id="c2">
  <input type="radio" name="card" id="c3">

  <div class="cards">

    
    <div class="card card1">
      <h2>OPSYST1</h2>
      <p>What is an Operating System?</p>
      <hr>
      <p>It manages hardware and software resources.</p>

      <div class="buttons">
        <label for="c2">NEXT</label>
        <a class="end" href="index.html">END</a>
      </div>
    </div>

    
    <div class="card card2">
      <h2>OPSYST1</h2>
      <p>What is a Kernel?</p>
      <hr>
      <p>The core part of the operating system.</p>

      <div class="buttons">
        <label for="c1">BACK</label>
        <label for="c3">NEXT</label>
        <a class="end" href="index.html">END</a>
      </div>
    </div>

    
    <div class="card card3">
      <h2>OPSYST1</h2>
      <p>What is Process Management?</p>
      <hr>
      <p>Handles execution of processes in OS.</p>

      <div class="buttons">
        <label for="c2">BACK</label>
        <a class="end" href="fcards.html">END</a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
