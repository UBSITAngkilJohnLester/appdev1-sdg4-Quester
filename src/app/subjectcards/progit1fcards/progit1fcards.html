<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PROGIT1 Flashcards</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #9ec9d9;
}

input {
  display: none;
}

.container {
  position: relative;
  width: 520px;
}

.cards {
  position: relative;
  height: 300px;
}

.card {
  width: 100%;
  padding: 30px;
  background: #ffffff;
  border-radius: 15px;
  border: 2px solid #444;
  text-align: center;
  font-size: 20px;
  position: absolute;
  opacity: 0;
  transition: 0.4s ease;
  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

#c1:checked ~ .cards .card1,
#c2:checked ~ .cards .card2,
#c3:checked ~ .cards .card3 {
  opacity: 1;
  position: relative;
}

h2 {
  margin-bottom: 15px;
}

hr {
  margin: 15px 0;
}

.buttons {
  margin-top: 20px;
}

a, label {
  text-decoration: none;
  padding: 10px 18px;
  margin: 5px;
  background: #00a8cc;
  color: black;
  border-radius: 8px;
  border: 2px solid #333;
  display: inline-block;
  cursor: pointer;
  transition: 0.2s;
}

a:hover, label:hover {
  background: #008da8;
  transform: scale(1.05);
}

.end {
  background: #ff4d4d;
}

.end:hover {
  background: #cc0000;
}

.editable {
  outline: none;
  cursor: text;
  padding: 5px;
}

.editable:focus {
  outline: 2px solid #00a8cc;
  background: #f0fbff;
}
</style>
</head>

<body>

<div class="container">

  <input type="radio" name="card" id="c1" checked>
  <input type="radio" name="card" id="c2">
  <input type="radio" name="card" id="c3">

  <div class="cards">

    <div class="card card1">
      <h2 class="editable" contenteditable="true">OPSYST1</h2>

      <p class="editable" contenteditable="true">
        What is an Operating System?
      </p>

      <hr>

      <p class="editable" contenteditable="true">
        It manages hardware and software resources.
      </p>

      <div class="buttons">
        <label for="c2">Next</label>
        <a class="end" routerLink="/flashcards">End</a>
      </div>
    </div>

    <div class="card card2">
      <h2 class="editable" contenteditable="true">OPSYST1</h2>

      <p class="editable" contenteditable="true">
        What is a Kernel?
      </p>

      <hr>

      <p class="editable" contenteditable="true">
        The core part of the operating system.
      </p>

      <div class="buttons">
        <label for="c1">Back</label>
        <label for="c3">Next</label>
        <a class="end" routerLink="/flashcards">End</a>
      </div>
    </div>

    <div class="card card3">
      <h2 class="editable" contenteditable="true">OPSYST1</h2>

      <p class="editable" contenteditable="true">
        What is Process Management?
      </p>

      <hr>

      <p class="editable" contenteditable="true">
        Handles execution of processes in OS.
      </p>

      <div class="buttons">
        <label for="c2">Back</label>
        <a class="end" routerLink="/flashcards">End</a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
